name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$(printf '%s' "$T" | grep -oE 'cfut_[A-Za-z0-9]{48}' | head -1)"
          ACCT="$(printf '%s' "$A" | grep -oE '[0-9a-f]{32}' | head -1)"
          [ -n "$TOKEN" ] || { echo "TOKEN secret has no valid token"; exit 1; }
          [ -n "$ACCT" ] || { echo "ACCOUNT_ID secret has no valid id"; exit 1; }
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$ACCT"
          npx --yes wrangler@4 deploy
